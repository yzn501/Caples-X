<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>S.U.P.E.R.N.O.V.A - Command Control</title>
<style>
    body, html { margin: 0; padding: 0; background-color: #000; color: #00ff00; font-family: monospace; }
    .bg-image { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); opacity: 0.08; z-index: -1; width: 65%; pointer-events: none; filter: grayscale(100%); }
    .container { padding: 40px; max-width: 1100px; margin: auto; display: none; }
    #auth-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
    input, button { background: #000; border: 1px solid #00ff00; color: #00ff00; padding: 12px; margin: 8px 0; width: 100%; font-family: monospace; box-sizing: border-box; }
    button { cursor: pointer; font-weight: bold; }
    button:hover { background: #00ff00; color: #000; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; margin-bottom: 30px; }
    th, td { border: 1px solid #222; padding: 12px; text-align: left; }
    th { background: #0a101d; color: #00ff00; }
    .btn-acc { background: #003300; border-color: #00ff00; color: #00ff00; }
    .btn-rej { background: #330000; border-color: #ff0000; color: #ff0000; }
</style>
</head>
<body>
<img src="S.U.P.E.R.N.O.V.A.png" class="bg-image" alt="Background">

<div id="auth-screen">
    <div style="width: 320px; text-align: center;">
        <h3 style="color: #ff0000; letter-spacing: 2px;">RESTRICTED AREA</h3>
        <input type="password" id="admin_key" placeholder="Enter 10-Char Key">
        <button onclick="verify()">AUTHENTICATE</button>
        <p id="auth_msg" style="color:#ff0000; margin-top:10px;"></p>
    </div>
</div>

<div id="admin-panel" class="container">
    <h2>COMMAND CENTER: PENDING REQUESTS MONITOR</h2>
    <table>
        <thead><tr><th>ID</th><th>User</th><th>Discord</th><th>Request Reason</th><th>Action</th></tr></thead>
        <tbody id="req-table"></tbody>
    </table>

    <h2>ACCEPTED PERSONNEL DIRECTORY</h2>
    <table>
        <thead><tr><th>Discord Username</th><th>Cooperation Details</th></tr></thead>
        <tbody id="acc-table"></tbody>
    </table>
</div>

<script>
    let isAuthenticated = false;

    if(localStorage.getItem('admin_locked') === 'true') {
        document.body.innerHTML = '';
        document.body.style.backgroundColor = 'black';
    }

    let attempts = parseInt(localStorage.getItem('admin_attempts') || '0');

    function verify() {
        const key = document.getElementById('admin_key').value;
        const validKey = "S@p3rN0v#X"; 
        
        if(key.length !== 10) {
            failAttempt();
            return;
        }

        if(key === validKey) {
            isAuthenticated = true;
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('admin-panel').style.display = 'block';
            loadData();
        } else {
            failAttempt();
        }
    }

    function failAttempt() {
        attempts++;
        localStorage.setItem('admin_attempts', attempts);
        if(attempts >= 4) {
            localStorage.setItem('admin_locked', 'true');
            document.body.innerHTML = '';
        } else {
            document.getElementById('auth_msg').innerText = `ACCESS DENIED. ATTEMPTS REMAINING: ${4 - attempts}`;
        }
    }

    function loadData() {
        let requests = JSON.parse(localStorage.getItem('supernova_requests') || '[]');
        let tbody = document.getElementById('req-table');
        let accBody = document.getElementById('acc-table');
        tbody.innerHTML = '';
        accBody.innerHTML = '';

        requests.forEach(r => {
            if(r.status === 'pending') {
                tbody.innerHTML += `
                    <tr>
                        <td>${r.id}</td>
                        <td>${r.user}</td>
                        <td>${r.discord}</td>
                        <td>${r.reason}</td>
                        <td>
                            <button class="btn-acc" onclick="processReq(${r.id}, 'ACCEPTED')">ACCEPT</button>
                            <button class="btn-rej" onclick="processReq(${r.id}, 'REJECTED')">REJECT</button>
                        </td>
                    </tr>
                `;
            } else if (r.status === 'ACCEPTED') {
                accBody.innerHTML += `<tr><td>${r.discord}</td><td>${r.reason}</td></tr>`;
            }
        });
    }

    function processReq(id, status) {
        let customMsg = prompt("Enter decision note:");
        if(customMsg === null) return;

        // Automatically appends the required instruction to wait for Discord contact
        let fullMessage = customMsg + " (Please wait for contact from an organization member on Discord / انتظر الرد والتواصل من أحد أعضاء المنظمة في الديسكورد)";

        let requests = JSON.parse(localStorage.getItem('supernova_requests') || '[]');
        let responses = JSON.parse(localStorage.getItem('supernova_responses') || '[]');
        
        let reqIndex = requests.findIndex(r => r.id === id);
        if(reqIndex > -1) {
            requests[reqIndex].status = status;
            responses.push({
                reqId: id,
                user: requests[reqIndex].user,
                status: status,
                message: fullMessage
            });
            
            localStorage.setItem('supernova_requests', JSON.stringify(requests));
            localStorage.setItem('supernova_responses', JSON.stringify(responses));
            loadData();
        }
    }

    // Real-Time Auto Sync (Refreshes data every 2 seconds)
    setInterval(() => {
        if(isAuthenticated) {
            loadData();
        }
    }, 2000);
</script>
</body>
</html>
