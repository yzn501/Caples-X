<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مواجهة عبدالله الحماسية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg: #0b090a;
            --panel: #161a1d;
            --primary: #9b111e;
            --secondary: #d90429;
            --gold: #ffb703;
            --text: #f8f9fa;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; user-select: none; }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            padding: 20px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 10px;
            text-shadow: 0 0 15px var(--secondary);
            color: var(--text);
        }

        /* لافتة النقود */
        .score-container {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 20px;
            background: var(--panel);
            padding: 10px 30px;
            border-radius: 50px;
            border: 2px solid var(--primary);
            box-shadow: 0 0 15px rgba(155, 17, 30, 0.4);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .score-container span { color: var(--gold); font-weight: 900; }

        /* منطقة اللعب والأنميشن */
        .game-area {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 350px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
        }

        /* شخصية عبدالله الافتراضية الاحترافية */
        .target-box {
            width: 200px;
            height: 200px;
            background: linear-gradient(145deg, #1f2428, #0b090a);
            border: 4px solid var(--primary);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
            box-shadow: 0 0 30px rgba(155, 17, 30, 0.6);
            transition: transform 0.05s ease;
        }

        .target-box i { font-size: 5rem; color: #adb5bd; transition: 0.1s; }
        .target-box p { font-size: 1.5rem; font-weight: 900; margin-top: 10px; color: var(--text); letter-spacing: 1px; }

        /* أنميشن الاهتزاز والضرب */
        .hit { animation: shake 0.15s ease-in-out; border-color: var(--secondary); background: #2b0b10; }
        .hit i { color: var(--secondary); transform: scale(1.1); }

        @keyframes shake {
            0% { transform: translateX(0) scale(1); }
            25% { transform: translateX(-10px) rotate(-5deg) scale(0.95); }
            50% { transform: translateX(10px) rotate(5deg) scale(0.95); }
            75% { transform: translateX(-5px) scale(1); }
            100% { transform: translateX(0); }
        }

        /* أرقام الضرر المتطايرة */
        .damage-pop {
            position: absolute;
            font-size: 2rem;
            font-weight: 900;
            color: var(--secondary);
            text-shadow: 0 0 8px #000;
            pointer-events: none;
            animation: flyUp 0.6s ease-out forwards;
            z-index: 10;
        }

        @keyframes flyUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-120px) scale(1.4); }
        }

        /* متجر التطويرات */
        .shop-container {
            width: 100%;
            max-width: 500px;
            background: var(--panel);
            padding: 20px;
            border-radius: 20px;
            border: 1px solid rgba(155, 17, 30, 0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .shop-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .upgrade-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            border: 1px solid #2a080c;
            transition: 0.3s;
        }

        .upgrade-item:hover { border-color: var(--primary); background: rgba(155, 17, 30, 0.05); }

        .upgrade-info h3 { font-size: 1.1rem; margin-bottom: 3px; }
        .upgrade-info p { font-size: 0.85rem; color: #adb5bd; }

        .buy-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .buy-btn:hover:not(:disabled) { background: var(--secondary); transform: scale(1.05); }
        .buy-btn:disabled { background: #333; color: #777; cursor: not-allowed; }

        /* إحصائيات سريعة تحت */
        .stats {
            margin-top: 15px;
            display: flex;
            justify-content: space-around;
            font-size: 0.9rem;
            color: #aaa;
            width: 100%;
        }
    </style>
</head>
<body>

    <h1>مواجهة عبدالله</h1>
    
    <div class="score-container">
        <i class="fas fa-coins"></i>
        <span id="coinsDisplay">0</span> نقود
    </div>

    <div class="game-area">
        <div class="target-box" id="target">
            <i class="fas fa-user-ninja"></i>
            <p>عبدالله</p>
        </div>
    </div>

    <div class="shop-container">
        <div class="shop-title"><i class="fas fa-shopping-cart" style="color: var(--primary);"></i> متجر التطويرات الفخمة</div>
        
        <div class="upgrade-item">
            <div class="upgrade-info">
                <h3>قبضة حديدية (قوة الضربة)</h3>
                <p>تزيد قوتك بمقدار +1 لكل ضغطة</p>
                <p>المستوى الحالي: <span id="clickLvl">1</span></p>
            </div>
            <button class="buy-btn" id="buyClick">
                <span id="clickCost">10</span> <i class="fas fa-coins"></i>
            </button>
        </div>

        <div class="upgrade-item">
            <div class="upgrade-info">
                <h3>سلاح تلقائي (Auto-Clicker)</h3>
                <p>يضرب عبدالله تلقائياً +1 كل ثانية</p>
                <p>المستوى الحالي: <span id="autoLvl">0</span></p>
            </div>
            <button class="buy-btn" id="buyAuto">
                <span id="autoCost">50</span> <i class="fas fa-coins"></i>
            </button>
        </div>
    </div>

    <div class="stats">
        <div>قوة الضغطة الحالية: <span id="statsClick">1</span></div>
        <div>الضرب التلقائي/ثانية: <span id="statsAuto">0</span></div>
    </div>

    <script>
        // إعداد المتغيرات الأساسية للعبة
        let coins = 0;
        let clickPower = 1;
        let autoPower = 0;
        
        let clickUpgradeCost = 10;
        let autoUpgradeCost = 50;

        let clickLevel = 1;
        let autoLevel = 0;

        // استدعاء عناصر الواجهة
        const target = document.getElementById('target');
        const coinsDisplay = document.getElementById('coinsDisplay');
        const clickLvlDoc = document.getElementById('clickLvl');
        const clickCostDoc = document.getElementById('clickCost');
        const autoLvlDoc = document.getElementById('autoLvl');
        const autoCostDoc = document.getElementById('autoCost');
        const statsClick = document.getElementById('statsClick');
        const statsAuto = document.getElementById('statsAuto');
        const buyClickBtn = document.getElementById('buyClick');
        const buyAutoBtn = document.getElementById('buyAuto');

        // تحميل البيانات المحفوظة بالجهاز فور تشغيل اللعبة
        function loadData() {
            if(localStorage.getItem('saved_coins')) {
                coins = parseInt(localStorage.getItem('saved_coins'));
                clickPower = parseInt(localStorage.getItem('saved_clickPower'));
                autoPower = parseInt(localStorage.getItem('saved_autoPower'));
                clickUpgradeCost = parseInt(localStorage.getItem('saved_clickCost'));
                autoUpgradeCost = parseInt(localStorage.getItem('saved_autoCost'));
                clickLevel = parseInt(localStorage.getItem('saved_clickLevel'));
                autoLevel = parseInt(localStorage.getItem('saved_autoLevel'));
            }
            updateUI();
        }

        // حفظ البيانات في الجهاز
        function saveData() {
            localStorage.setItem('saved_coins', coins);
            localStorage.setItem('saved_clickPower', clickPower);
            localStorage.setItem('saved_autoPower', autoPower);
            localStorage.setItem('saved_clickCost', clickUpgradeCost);
            localStorage.setItem('saved_autoCost', autoUpgradeCost);
            localStorage.setItem('saved_clickLevel', clickLevel);
            localStorage.setItem('saved_autoLevel', autoLevel);
        }

        // تحديث أزرار ونصوص الواجهة بشكل مستمر
        function updateUI() {
            coinsDisplay.innerText = coins;
            clickLvlDoc.innerText = clickLevel;
            clickCostDoc.innerText = clickUpgradeCost;
            autoLvlDoc.innerText = autoLevel;
            autoCostDoc.innerText = autoUpgradeCost;
            statsClick.innerText = clickPower;
            statsAuto.innerText = autoPower;

            // تفعيل أو تعطيل الأزرار حسب رصيد الفلوس
            buyClickBtn.disabled = coins < clickUpgradeCost;
            buyAutoBtn.disabled = coins < autoUpgradeCost;
        }

        // أنميشن ظهور رقم الضرر المتطاير
        function createDamagePop(amount) {
            const pop = document.createElement('div');
            pop.classList.add('damage-pop');
            pop.innerText = `+${amount}`;
            
            // توزيع عشوائي طفيف لمكان خروج الأرقام عشان ما تطلع فوق بعض
            const randomX = Math.random() * 60 - 30; 
            const randomY = Math.random() * 40 - 20;
            pop.style.transform = `translate(${randomX}px, ${randomY}px)`;
            
            document.querySelector('.game-area').appendChild(pop);
            
            // حذف العنصر بعد اكتمال الأنميشن عشان لا يثقل الجهاز
            setTimeout(() => { pop.remove(); }, 600);
        }

        // نظام الضغط (الضرب)
        target.addEventListener('click', () => {
            coins += clickPower;
            
            // تشغيل أنميشن الاهتزاز
            target.classList.add('hit');
            setTimeout(() => { target.classList.remove('hit'); }, 150);
            
            createDamagePop(clickPower);
            updateUI();
            saveData();
        });

        // شراء تطوير قوة الضربة
        buyClickBtn.addEventListener('click', (e) => {
            e.stopPropagation(); // يمنع احتساب الضغطة كضربة لعبدالله
            if (coins >= clickUpgradeCost) {
                coins -= clickUpgradeCost;
                clickLevel++;
                clickPower += 1;
                clickUpgradeCost = Math.floor(clickUpgradeCost * 1.5); // زيادة السعر للمرة الجاية
                updateUI();
                saveData();
            }
        });

        // شراء تطوير الضرب التلقائي
        buyAutoBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (coins >= autoUpgradeCost) {
                coins -= autoUpgradeCost;
                autoLevel++;
                autoPower += 1;
                autoUpgradeCost = Math.floor(autoUpgradeCost * 1.6);
                updateUI();
                saveData();
            }
        });

        // العمل المستمر للـ Auto-Clicker في الخلفية (كل ثانية)
        setInterval(() => {
            if (autoPower > 0) {
                coins += autoPower;
                createDamagePop(autoPower);
                updateUI();
                saveData();
            }
        }, 1000);

        // تشغيل اللعبة وتحميل البيانات أول ما تفتح الصفحة
        loadData();
    </script>
</body>
</html>
